<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyblue Project</title>
<meta name="description" content="Skyblue Project makes simple, offline-friendly mobile games.">
<style>
  :root { --sky:#3b82f6; --ink:#1f2937; --muted:#6b7280; --bg:#f5f9ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
  header { background:linear-gradient(135deg,#60a5fa,#2563eb); color:#fff; padding:56px 20px 48px; text-align:center; }
  header h1 { margin:0 0 8px; font-size:2rem; }
  header p { margin:0; opacity:.9; }
  main { max-width:720px; margin:0 auto; padding:32px 16px 48px; }
  .card { background:#fff; border-radius:14px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:20px; }
  .card h2 { margin:0 0 6px; font-size:1.3rem; }
  .card p { margin:0 0 14px; color:var(--muted); }
  a.btn { display:inline-block; background:var(--sky); color:#fff; text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:600; }
  footer { text-align:center; color:var(--muted); font-size:.9rem; padding:0 16px 40px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Skyblue Project</h1>
  <p>Simple mobile games you can play anywhere.</p>
</header>
<main>
  <div class="card">
    <h2>Reversi World Cup</h2>
    <p>Play Reversi (Othello) against the computer. Choose your AI difficulty and work your way up through the tournament.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.skyblueproject.reversi">Get it on Google Play</a>
  </div>
</main>
<footer>
  <p><a href="privacy.html">Privacy Policy</a></p>
  <p>&copy; 2026 Skyblue Project</p>
</footer>
</body>
</html>
